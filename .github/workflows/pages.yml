name: Publish APEX to GitHub Pages
on:
  push:
    branches: [main, astra/physics-pipeline-repair, astra/progressive-tyre-recovery]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned Racing26 M5 donor
        if: ${{ hashFiles('integration/m5-bridge.ts') != '' }}
        run: |
          mkdir -p .vendor
          git init .vendor/Racing26
          git -C .vendor/Racing26 remote add origin https://github.com/iLuzionsX/Racing26.git
          git -C .vendor/Racing26 fetch --depth 1 origin abff9f452e4c2b22ac1220a1414418ace3f36e0a
          git -C .vendor/Racing26 checkout --detach FETCH_HEAD
      - name: Build Racing26 M5 runtime
        if: ${{ hashFiles('integration/m5-bridge.ts') != '' }}
        run: |
          npm install --no-package-lock --no-save esbuild@0.25.9 three@0.185.1
          npx esbuild integration/m5-bridge.ts --bundle --format=esm --platform=browser --target=es2022 --external:three --define:import.meta.env.BASE_URL='"./"' --outfile=dist/m5-runtime.js
          mkdir -p dist/assets/bmw-m5-g90-default
          cp .vendor/Racing26/public/assets/bmw-m5-g90-default/part-*.b64 dist/assets/bmw-m5-g90-default/
      - name: Validate Racerrhi physics pipeline integration
        run: npx --yes tsx@4.20.6 integration/m5-pipeline-regression.test.ts
      - name: Diagnose Racerrhi grip-limit response
        run: npx --yes tsx@4.20.6 integration/m5-grip-limit-regression.test.ts
      - name: Validate Racerrhi deterministic tire reference loads
        run: npx --yes tsx@4.20.6 integration/m5-reference-load-regression.test.ts
      - name: Validate Racerrhi M5 disturbance recovery
        run: npx --yes tsx@4.20.6 integration/m5-racerrhi-recovery.test.ts
      - name: Validate Racerrhi first-turn steering
        run: npx --yes tsx@4.20.6 integration/m5-first-turn-regression.test.ts
      - name: Validate Racerrhi surface continuity
        run: npx --yes tsx@4.20.6 integration/m5-surface-continuity-regression.test.ts
      - name: Validate mixed steering handoff and staged wheel pose
        run: npx --yes tsx@4.20.6 integration/m5-steering-handoff-regression.test.ts
      - name: Compare driver slide-recovery inputs
        run: npx --yes tsx@4.20.6 integration/m5-driver-recovery-regression.test.ts
      - name: Validate game
        run: |
          if [ -f dist/m5-runtime.js ]; then node --check dist/m5-runtime.js; fi
          node --check dist/game.js
          node --check dist/ui.js
          node --check dist/visuals.js
          node test.mjs
      - name: Install browser smoke dependencies
        run: |
          npm install --no-package-lock --no-save playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Verify real browser startup and controls
        run: xvfb-run -a node integration/browser-smoke.mjs
  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    environment:
      name: ${{ github.ref_name == 'main' && 'github-pages' || 'racerrhi-physics-preview' }}
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch pinned Racing26 M5 donor
        run: |
          mkdir -p .vendor
          git init .vendor/Racing26
          git -C .vendor/Racing26 remote add origin https://github.com/iLuzionsX/Racing26.git
          git -C .vendor/Racing26 fetch --depth 1 origin abff9f452e4c2b22ac1220a1414418ace3f36e0a
          git -C .vendor/Racing26 checkout --detach FETCH_HEAD
      - name: Build deployable Racing26 M5 runtime
        run: |
          npm install --no-package-lock --no-save esbuild@0.25.9 three@0.185.1
          npx esbuild integration/m5-bridge.ts --bundle --format=esm --platform=browser --target=es2022 --external:three --define:import.meta.env.BASE_URL='"./"' --outfile=dist/m5-runtime.js
          mkdir -p dist/assets/bmw-m5-g90-default
          cp .vendor/Racing26/public/assets/bmw-m5-g90-default/part-*.b64 dist/assets/bmw-m5-g90-default/
          printf '{"commit":"%s","ref":"%s","donor":"%s"}\n' '${{ github.sha }}' '${{ github.ref }}' 'abff9f452e4c2b22ac1220a1414418ace3f36e0a' > dist/build-info.json
      - name: Check out production main for isolated branch preview
        if: github.ref_name != 'main'
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-main
      - name: Assemble Pages artifact without replacing production root
        run: |
          rm -rf site
          mkdir -p site
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            cp -a dist/. site/
          else
            mkdir -p production-main/.vendor
            cp -a .vendor/Racing26 production-main/.vendor/Racing26
            npx esbuild production-main/integration/m5-bridge.ts --bundle --format=esm --platform=browser --target=es2022 --external:three --define:import.meta.env.BASE_URL='"./"' --outfile=production-main/dist/m5-runtime.js
            mkdir -p production-main/dist/assets/bmw-m5-g90-default
            cp .vendor/Racing26/public/assets/bmw-m5-g90-default/part-*.b64 production-main/dist/assets/bmw-m5-g90-default/
            MAIN_SHA="$(git -C production-main rev-parse HEAD)"
            printf '{"commit":"%s","ref":"refs/heads/main","donor":"%s"}\n' "$MAIN_SHA" 'abff9f452e4c2b22ac1220a1414418ace3f36e0a' > production-main/dist/build-info.json
            cp -a production-main/dist/. site/
            case "${GITHUB_REF_NAME}" in
              astra/progressive-tyre-recovery) PREVIEW_SLUG="pr-17" ;;
              astra/physics-pipeline-repair) PREVIEW_SLUG="pr-16" ;;
              *) PREVIEW_SLUG="branch-preview" ;;
            esac
            mkdir -p "site/previews/$PREVIEW_SLUG"
            cp -a dist/. "site/previews/$PREVIEW_SLUG/"
            printf '%s\n' "$PREVIEW_SLUG" > site/preview-slug.txt
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
